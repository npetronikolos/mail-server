{% extends "base.html" %}
{% block title %}Two-factor sign-in{% endblock %}
{% block solo %}
<form method="post" class="card login">
  <h1>Enter your code</h1>
  <p class="muted">Open your authenticator app and enter the 6-digit code for <strong>{{ email }}</strong>.</p>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Code<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" required autofocus></label>
  <button class="btn primary wide">Verify</button>
  <p class="muted small"><a href="{{ url_for('login') }}">Back to sign in</a></p>
</form>
{% endblock %}
