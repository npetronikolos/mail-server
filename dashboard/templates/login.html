{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block solo %}
<form method="post" class="card login">
  <div class="brand big">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h13A2.5 2.5 0 0 1 21 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m4 7 8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    <span><strong>Mail</strong><small>{{ conf.MAIL_HOSTNAME }}</small></span>
  </div>
  <h1>Sign in</h1>
  <p class="muted">Use your email address and email password.</p>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Email address<input name="email" type="text" autocomplete="username" value="{{ email }}" required autofocus></label>
  <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
  <button class="btn primary wide">Sign in</button>
</form>
{% endblock %}
