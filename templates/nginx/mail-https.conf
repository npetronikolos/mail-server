
# Managed by mail-server install.sh
server {
    listen 443 ssl;
{{NGINX_LISTEN_V6_HTTPS}}
    server_name {{WEB_SERVER_NAMES}};

    ssl_certificate     {{TLS_CERT}};
    ssl_certificate_key {{TLS_KEY}};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:mailssl:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size {{WEB_UPLOAD_LIMIT_MB}}m;
    server_tokens off;

    # Automatic account setup (Thunderbird, K-9/Thunderbird for Android, ...)
    location = /mail/config-v1.1.xml {
        alias /var/www/mail-autoconfig/config-v1.1.xml;
        default_type application/xml;
    }
    location = /.well-known/autoconfig/mail/config-v1.1.xml {
        alias /var/www/mail-autoconfig/config-v1.1.xml;
        default_type application/xml;
    }

{{WEBMAIL_LOCATIONS}}
}
