
# Managed by mail-server install.sh
server {
    listen 443 ssl;
{{NGINX_LISTEN_V6_HTTPS}}
    server_name {{MAIL_HOSTNAME}};

    ssl_certificate     {{TLS_CERT}};
    ssl_certificate_key {{TLS_KEY}};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:mailssl:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size {{WEB_UPLOAD_LIMIT_MB}}m;
    server_tokens off;

{{AUTOCONFIG_LOCATIONS}}
{{DASHBOARD_LOCATIONS}}
{{DAV_LOCATIONS}}
{{WEBMAIL_LOCATIONS}}
}

# mta-sts.<domain>, autoconfig.<domain>, autodiscover.<domain> for every
# hosted domain. "mailctl cert" adds these names to the certificate once
# their DNS points here.
server {
    listen 443 ssl;
{{NGINX_LISTEN_V6_HTTPS}}
    server_name ~^(mta-sts|autoconfig|autodiscover)\.;

    ssl_certificate     {{TLS_CERT}};
    ssl_certificate_key {{TLS_KEY}};
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

{{AUTOCONFIG_LOCATIONS}}
    location / {
        return 404;
    }
}
