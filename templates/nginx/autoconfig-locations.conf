    # Automatic account setup: Thunderbird and friends
    location = /mail/config-v1.1.xml {
        alias /var/www/mail-autoconfig/config-v1.1.xml;
        default_type application/xml;
    }
    location = /.well-known/autoconfig/mail/config-v1.1.xml {
        alias /var/www/mail-autoconfig/config-v1.1.xml;
        default_type application/xml;
    }
    # Outlook (clients POST to this URL)
    location ~* ^/autodiscover/autodiscover\.xml$ {
        default_type application/xml;
        return 200 '{{AUTODISCOVER_XML}}';
    }
    # MTA-STS policy (RFC 8461)
    location = /.well-known/mta-sts.txt {
        alias /var/www/mail-autoconfig/mta-sts.txt;
        default_type text/plain;
    }
