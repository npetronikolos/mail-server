    # Calendar and contacts (Radicale on 127.0.0.1:5232). nginx asks the
    # dashboard to check the email password, then passes the user name on.
    location = /.well-known/caldav {
        return 301 /dav/;
    }
    location = /.well-known/carddav {
        return 301 /dav/;
    }
    location /dav/ {
        auth_request /_dav_auth;
        auth_request_set $dav_user $upstream_http_x_remote_user;
        error_page 401 = @dav_login;
        proxy_pass http://127.0.0.1:5232/;
        proxy_set_header X-Script-Name /dav;
        proxy_set_header X-Remote-User $dav_user;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location @dav_login {
        add_header WWW-Authenticate 'Basic realm="Calendar and contacts", charset="UTF-8"' always;
        return 401;
    }
    location = /_dav_auth {
        internal;
        proxy_pass http://127.0.0.1:8090/admin/_auth/dav;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
    }
