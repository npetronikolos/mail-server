# Managed by mail-server install.sh -- re-running the installer overwrites it.
# Dovecot 2.4 (Ubuntu 25.04 and later)

dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap lmtp sieve
listen = {{DOVECOT_LISTEN}}
mail_plugins {
  quota = yes
  acl = yes
  fts = yes
  fts_flatcurve = yes
}

# ---------------------------------------------------------------- TLS
ssl = required
ssl_server_cert_file = {{TLS_CERT}}
ssl_server_key_file = {{TLS_KEY}}
ssl_min_protocol = TLSv1.2

# ---------------------------------------------------------------- Auth
auth_mechanisms = plain login
auth_allow_cleartext = no
auth_username_format = %{user | lower}

passdb passwd-file {
  passwd_file_path = /etc/dovecot/users
}
# App passwords ("mailctl user apppass"): one file per password, named after
# its SHA-256, so a mailbox can have several. Tried when the mailbox password
# does not match, or is not allowed from outside this server.
passdb app-passwords {
  driver = passwd-file
  passwd_file_path = /etc/dovecot/app-passwords/%{password | sha256}
}
userdb passwd-file {
  passwd_file_path = /etc/dovecot/users
  # uid/gid/home in every lookup: IMAP sessions need them to open mailboxes
  # that other users share with them.
  fields {
    uid = vmail
    gid = vmail
    home = /var/vmail/%{user | domain}/%{user | username}
  }
}

# ---------------------------------------------------------------- Storage
mail_uid = vmail
mail_gid = vmail
first_valid_uid = {{VMAIL_UID}}
last_valid_uid = {{VMAIL_UID}}
mail_home = /var/vmail/%{user | domain}/%{user | username}
mail_driver = maildir
mail_path = ~/Maildir
recipient_delimiter = +

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
    autoexpunge = 30d
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}

# ---------------------------------------------------------------- Services
# IMAP only over TLS on port 993; plain port 143 is switched off.
service imap-login {
  inet_listener imap {
    port = 0
  }
}

service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

protocol imap {
  mail_max_userip_connections = 50
  mail_plugins {
    imap_quota = yes
    imap_sieve = yes
    imap_acl = yes
  }
}

protocol lmtp {
  postmaster_address = postmaster@{{DOMAIN}}
  mail_plugins {
    sieve = yes
  }
}

# ---------------------------------------------------------------- Quota
# Per-mailbox limits are set with "mailctl user quota" (stored in the users
# file); mailboxes without a limit are unlimited. Postfix asks the
# quota-status service before accepting mail, so mail for a full mailbox is
# refused during the SMTP conversation instead of bouncing later.
quota "User quota" {
  driver = count
}
quota_status_success = DUNNO
quota_status_nouser = DUNNO
quota_status_overquota = 552 5.2.2 Mailbox is full
quota_status_toolarge = 552 5.2.3 Message is larger than the mailbox quota

service quota-status {
  executable = quota-status -p postfix
  inet_listener quota-status {
    listen = 127.0.0.1
    port = 12340
  }
  client_limit = 1
}

# ---------------------------------------------------------------- Shared mailboxes
# A mailbox shared with other users ("mailctl share") appears in their mail
# apps under Shared/<address>/. Read/unread flags are kept per user.
namespace shared {
  type = shared
  separator = /
  prefix = Shared/$user/
  mail_driver = maildir
  mail_path = %{owner_home}/Maildir
  mail_index_private_path = ~/Maildir/shared/%{owner_user}
  subscriptions = no
  list = children
}
acl_driver = vfile
acl_sharing_map {
  dict file {
    path = /var/vmail/shared-mailboxes.db
  }
}

# ---------------------------------------------------------------- Full-text search
# Fast searching of message bodies (Flatcurve index, updated as mail arrives).
fts flatcurve {
  substring_search = yes
}
fts_autoindex = yes
fts_search_add_missing = yes
language en {
  default = yes
}
language_tokenizers = generic email-address
mailbox Trash {
  fts_autoindex = no
}
mailbox Junk {
  fts_autoindex = no
}

# ---------------------------------------------------------------- Sieve
# Users' own filters (managed from Roundcube -> Settings -> Filters).
sieve_script personal {
  driver = file
  path = ~/sieve
  active_path = ~/.dovecot.sieve
}

# Forwarding and vacation replies set on the dashboard's account page.
sieve_script dashboard {
  type = before
  driver = file
  path = ~/dashboard.sieve
}
# Forwarded mail is sent from the forwarding address, so SPF still passes.
sieve_redirect_envelope_from = recipient

# After the user's filters: move mail flagged as spam into Junk.
sieve_script spam-to-junk {
  type = after
  driver = file
  path = /etc/dovecot/sieve/spam-to-junk.sieve
}

# Spam training: moving mail into Junk teaches Rspamd "spam",
# moving it out of Junk teaches "ham".
sieve_plugins {
  sieve_imapsieve = yes
  sieve_extprograms = yes
}
sieve_global_extensions {
  vnd.dovecot.pipe = yes
}
sieve_pipe_bin_dir = /etc/dovecot/sieve

mailbox Junk {
  sieve_script report-spam {
    type = before
    cause = copy
    driver = file
    path = /etc/dovecot/sieve/report-spam.sieve
  }
}

imapsieve_from Junk {
  sieve_script report-ham {
    type = before
    cause = copy
    driver = file
    path = /etc/dovecot/sieve/report-ham.sieve
  }
}
