# Managed by mail-server install.sh -- re-running the installer overwrites it.
# Dovecot 2.3 (Ubuntu 24.04)

protocols = imap lmtp sieve
listen = {{DOVECOT_LISTEN}}
mail_plugins = $mail_plugins quota acl fts fts_xapian

# ---------------------------------------------------------------- TLS
ssl = required
ssl_cert = <{{TLS_CERT}}
ssl_key = <{{TLS_KEY}}
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = yes

# ---------------------------------------------------------------- Auth
auth_mechanisms = plain login
disable_plaintext_auth = yes
auth_username_format = %Lu

passdb {
  driver = passwd-file
  args = /etc/dovecot/users
}
userdb {
  driver = passwd-file
  args = /etc/dovecot/users
  # uid/gid/home in every lookup: IMAP sessions need them to open mailboxes
  # that other users share with them.
  default_fields = uid=vmail gid=vmail home=/var/vmail/%d/%n
}

# ---------------------------------------------------------------- Storage
mail_uid = vmail
mail_gid = vmail
first_valid_uid = {{VMAIL_UID}}
last_valid_uid = {{VMAIL_UID}}
mail_home = /var/vmail/%d/%n
mail_location = maildir:~/Maildir
recipient_delimiter = +

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
    autoexpunge = 30d
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}

# ---------------------------------------------------------------- Services
# IMAP only over TLS on port 993; plain port 143 is switched off.
service imap-login {
  inet_listener imap {
    port = 0
  }
}

service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

protocol imap {
  mail_max_userip_connections = 50
  mail_plugins = $mail_plugins imap_quota imap_sieve imap_acl
}

protocol lmtp {
  postmaster_address = postmaster@{{DOMAIN}}
  mail_plugins = $mail_plugins sieve
}

# ---------------------------------------------------------------- Quota
# Per-mailbox limits are set with "mailctl user quota" (stored in the users
# file); mailboxes without a limit are unlimited. Postfix asks the
# quota-status service before accepting mail, so mail for a full mailbox is
# refused during the SMTP conversation instead of bouncing later.
plugin {
  quota = count:User quota
  quota_vsizes = yes
  quota_grace = 10%%
  quota_status_success = DUNNO
  quota_status_nouser = DUNNO
  quota_status_overquota = 552 5.2.2 Mailbox is full
  quota_status_toolarge = 552 5.2.3 Message is larger than the mailbox quota
}

service quota-status {
  executable = quota-status -p postfix
  inet_listener {
    address = 127.0.0.1
    port = 12340
  }
  client_limit = 1
}

# ---------------------------------------------------------------- Shared mailboxes
# A mailbox shared with other users ("mailctl share") appears in their mail
# apps under Shared/<address>/. Read/unread flags are kept per user.
namespace shared {
  type = shared
  separator = /
  prefix = Shared/%%u/
  location = maildir:%%h/Maildir:INDEXPVT=~/Maildir/shared/%%u
  subscriptions = no
  list = children
}
plugin {
  acl = vfile
  acl_shared_dict = file:/var/vmail/shared-mailboxes.db
}

# ---------------------------------------------------------------- Full-text search
# Fast searching of message bodies (Xapian index, updated as mail arrives).
plugin {
  fts = xapian
  fts_xapian = partial=3 full=20 verbose=0
  fts_autoindex = yes
  fts_enforced = yes
  fts_autoindex_exclude = \Trash
  fts_autoindex_exclude2 = \Junk
}
service indexer-worker {
  vsz_limit = 2G
}

# ---------------------------------------------------------------- Sieve
plugin {
  # Users' own filters (managed from Roundcube -> Settings -> Filters).
  sieve = file:~/sieve;active=~/.dovecot.sieve

  # Forwarding and vacation replies set on the dashboard's account page.
  sieve_before = ~/dashboard.sieve
  # Forwarded mail is sent from the forwarding address, so SPF still passes.
  sieve_redirect_envelope_from = recipient

  # After the user's filters: move mail flagged as spam into Junk.
  sieve_after = /etc/dovecot/sieve/spam-to-junk.sieve

  # Spam training: moving mail into Junk teaches Rspamd "spam",
  # moving it out of Junk teaches "ham".
  sieve_plugins = sieve_imapsieve sieve_extprograms
  sieve_global_extensions = +vnd.dovecot.pipe
  sieve_pipe_bin_dir = /etc/dovecot/sieve

  imapsieve_mailbox1_name = Junk
  imapsieve_mailbox1_causes = COPY
  imapsieve_mailbox1_before = file:/etc/dovecot/sieve/report-spam.sieve

  imapsieve_mailbox2_name = *
  imapsieve_mailbox2_from = Junk
  imapsieve_mailbox2_causes = COPY
  imapsieve_mailbox2_before = file:/etc/dovecot/sieve/report-ham.sieve
}
